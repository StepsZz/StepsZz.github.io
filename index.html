<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- ... Diğer head içerikleri aynı ... -->
    <style>
        :root {
            --bg: #030712;
            --card-bg: #0f172a;
            --accent: #ff4d4d; /* Akman kırmızı tonu */
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 77, 77, 0.2); /* Kırmızımsı kenarlık */
            --menu-red: #cc0000; /* Menü için ana kırmızı */
        }

        /* --- ÖZEL İMLEÇ (Kırmızıya uyarlandı) --- */
        .cursor-dot { background: var(--accent); }
        .cursor-outline { border: 1px solid var(--accent); }

        /* --- ÜST MENÜ GÜNCELLEMESİ --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(90deg, #8b0000 0%, #cc0000 100%); /* Kırmızı geçişli arka plan */
            backdrop-filter: blur(10px);
            z-index: 5000; 
            border-bottom: 2px solid #ffffff; /* Beyaz alt çizgi */
            box-shadow: 0 4px 15px rgba(204, 0, 0, 0.3);
        }

        nav a {
            color: #ffffff !important; /* Yazılar tamamen beyaz */
            text-decoration: none; margin: 0 20px;
            font-weight: 700; font-size: 0.9rem; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.3s; position: relative;
        }

        nav a::after {
            content: ''; position: absolute; bottom: -5px; left: 0; width: 0;
            height: 2px; background: #ffffff; /* Hover alt çizgisi beyaz */
            transition: 0.3s;
        }

        nav a:hover::after { width: 100%; }
        
        /* Hover durumunda yazı hafifçe parlasın */
        nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        .lang-switcher {
            position: fixed; top: 18px; right: 30px; z-index: 5001;
            padding: 8px 15px; border-radius: 30px; 
            border: 2px solid #ffffff; /* Beyaz kenarlık */
            background: transparent; color: #ffffff; font-weight: bold;
            transition: 0.3s;
        }
        .lang-switcher:hover { background: #ffffff; color: var(--menu-red); }

        /* Ana başlık ve vurguları da kırmızı temasına çektim */
        .hero-title {
            background: linear-gradient(to right, #ffffff, #ff4d4d);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .typewriter { color: #ff4d4d; }
        .section-tag { color: #ff4d4d; }
        h2 { color: #ffffff; }

        /* ... Diğer stiller (AOS, Grid, Stats) aynı kalabilir ... */
    </style>
</head>
<body>
    <!-- Body içeriği ve Script bölümleri bir önceki "Master" tasarım ile aynıdır -->
    <!-- Sadece renk değişkenleri ve nav stili yukarıdaki gibi değişti -->
</body>
</html>
