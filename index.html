<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepsKyraxana | Portfolio</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        :root {
            --bg-deep: #0a0f1d; /* Daha derin, mat bir gece mavisi */
            --bg-card: #161e2d;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8; 
            --success: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--bg-deep);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Partikül Katmanı Düzenlemesi */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            top: 0;
            left: 0;
            /* Hafif bir vinyet efekti ekleyerek odak noktasını merkeze çeker */
            background: radial-gradient(circle, transparent 20%, var(--bg-deep) 100%);
        }

        /* Dil Değiştirici */
        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1100;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px 18px;
            border-radius: 25px;
            cursor: pointer;
            color: var(--accent);
            font-weight: 500;
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .lang-switcher:hover {
            background: var(--accent);
            color: var(--bg-deep);
            transform: scale(1.05);
        }

        /* Diğer CSS bölümleri aynı kalabilir, tasarım bütünlüğü için sadeleştirildi */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 25px;
            text-align: center;
            background: rgba(10, 15, 29, 0.7);
            backdrop-filter: blur(15px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        nav a {
            margin: 0 18px;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: 0.3s;
        }

        nav a:hover { color: var(--accent); }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 { font-size: 4.5rem; margin-bottom: 15px; letter-spacing: -2px; font-weight: 800; }
        
        .typewriter-container {
            font-size: 1.4rem;
            color: var(--accent);
            opacity: 0.8;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 40px;
            width: 100%;
            max-width: 420px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
        }

        .stat-value { display: block; font-size: 1.6rem; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; }

        .container { max-width: 900px; margin: 0 auto; padding: 100px 25px; }
        h2 { color: var(--text-main); font-size: 2rem; margin-bottom: 35px; position: relative; }
        h2::after { content: ''; position: absolute; left: 0; bottom: -10px; width: 50px; height: 3px; background: var(--accent); }
        
        .section { margin-bottom: 120px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .card { padding: 40px; background: var(--bg-card); border-radius: 20px; transition: 0.4s; border: 1px solid rgba(255,255,255,0.03); }
        .card:hover { transform: translateY(-8px); border-color: rgba(56, 189, 248, 0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }

        .btn {
            background: var(--accent);
            color: var(--bg-deep);
            padding: 16px 35px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            display: inline-block;
            margin-top: 40px;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
            transition: 0.3s;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(56, 189, 248, 0.4); }

        footer { text-align: center; padding: 50px; border-top: 1px solid rgba(255,255,255,0.05); color: var(--text-dim); font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- Kodun geri kalan HTML yapısı bir öncekiyle aynıdır -->
    <button class="lang-switcher" onclick="toggleLanguage()">EN | TR</button>
    <div id="particles-js"></div>

    <!-- ... Diğer HTML elementleri ... -->

    <script>
        // Yeni "Zarif" Partikül Ayarları
        particlesJS("particles-js", {
            "particles": {
                "number": { 
                    "value": 100, /* Daha fazla ama daha küçük partikül */
                    "density": { "enable": true, "value_area": 1000 } 
                },
                "color": { "value": "#38bdf8" },
                "shape": { "type": "circle" },
                "opacity": { 
                    "value": 0.3, /* Çok şeffaf, göz yormaz */
                    "random": true, 
                    "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false }
                },
                "size": { 
                    "value": 1.5, /* Çok küçük partiküller */
                    "random": true,
                    "anim": { "enable": false }
                },
                "line_linked": { 
                    "enable": true, 
                    "distance": 150, 
                    "color": "#38bdf8", 
                    "opacity": 0.1, /* Bağlantı çizgileri çok belirsiz ve zarif */
                    "width": 0.5 
                },
                "move": { 
                    "enable": true, 
                    "speed": 0.6, /* Çok yavaş, huzurlu bir hareket */
                    "direction": "none", 
                    "random": true, 
                    "straight": false, 
                    "out_mode": "out", 
                    "bounce": false 
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { 
                    "onhover": { "enable": true, "mode": "bubble" }, /* Üzerine gelince hafifçe parlar */
                    "onclick": { "enable": true, "mode": "push" }, 
                    "resize": true 
                },
                "modes": { 
                    "bubble": { "distance": 200, "size": 4, "duration": 2, "opacity": 0.6 },
                    "push": { "particles_nb": 3 } 
                }
            },
            "retina_detect": true
        });

        // Diğer JavaScript (Dil değiştirme, daktilo vb.) fonksiyonlarını buraya ekleyebilirsin.
    </script>
</body>
</html>
